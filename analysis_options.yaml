# Analiz + lint ayarları. `flutter analyze` bunu okur.
#
# Taban: flutter_lints. Altındaki liste ONA EKLENEN kurallar — hepsi bir kez
# koşturulup çıkan bulgu sayısı ve örnekleri gözle bakılarak seçildi. Kural
# eklerken aynısını yap: önce aç, `flutter analyze` ile kaç bulgu ve NE tür
# bulgu çıktığına bak, sonra kalıcı yap. Gürültülü kural, gerçek uyarıyı
# görünmez yapar — bu dosyanın tek işi analyze çıktısını "sıfır" tutmak.

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # ── const: Flutter'ın rebuild maliyeti ───────────────────────────────────
    # const widget yeniden kurulmaz, aynı örnek kullanılır. Oyun HUD'ı her
    # karede setState yiyor; buradaki kazanç kozmetik değil.
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_literals_to_create_immutables: true
    prefer_const_declarations: true

    # ── gerçek hata yakalayanlar ─────────────────────────────────────────────
    # Yakalanmamış Future = sessiz async hata (audio_manager'da bir tane vardı).
    unawaited_futures: true
    # Okunmayan constructor parametresi = yalan imza (Personality.fromSeed).
    avoid_unused_constructor_parameters: true

    # ── biçim/tutarlılık (hepsi zaten uyumluydu, kilitliyoruz) ───────────────
    prefer_single_quotes: true
    always_declare_return_types: true
    use_super_parameters: true
    unnecessary_await_in_return: true

    # ── sadeleştirme ─────────────────────────────────────────────────────────
    unnecessary_lambdas: true
    unnecessary_parenthesis: true
    prefer_final_locals: true
    directives_ordering: true

    # BİLEREK AÇILMADI — avoid_redundant_argument_values:
    # 357 bulgu veriyor ve çoğu ayar tablolarında: `spriteScale: 1.0`,
    # `pose: ActPose.labor`. Bu projede varsayılana eşit değer GÜRÜLTÜ DEĞİL,
    # belge: bina tablosunda satırlar hizalı durur ve hangi kolonun ayar knob'ı
    # olduğu görünür. Silmek okunabilirliği düşürürdü.
